<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slyšíš? Vidím! Hledám… - Velappky</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Zvuková mapa okolí: místa, nahrávky a časová osa příběhu.">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/velappky.css?v=202611102130">
<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css?v=202611102130">
<link rel="stylesheet" href="/assets/vendor/leaflet.markercluster/MarkerCluster.css?v=202611102130">
<link rel="stylesheet" href="style.css?v=202611102130">
</head>
<body class="is-app zm-app">

<header class="v-header">
  <div class="v-header__in">
    <div class="a-titlebar">
      <a class="a-back" href="/">
        <span data-icon="ui_back"></span><span class="a-back__label">Velappky</span>
      </a>
      <div class="a-name">
        <span class="v-icon tone-green" data-icon="zvukova"></span>
        <h1>Slyšíš? Vidím! Hledám…</h1>
      </div>
    </div>
    <a class="v-logo v-logo--small" href="/" aria-label="Velappky - úvod">
      <img src="/assets/vela-logo.png" alt="škola Vela" width="255" height="99">
    </a>
  </div>
</header>

<main class="zm-gate" id="gate">
  <form class="a-card zm-gate__card" id="gate-form">
    <label class="c-label zm-gate__label" for="gate-input">Zadej heslo, které ti dá dospělák</label>
    <input class="c-input" type="password" id="gate-input" name="password" autocomplete="current-password" required>
    <p class="zm-modal__err" id="gate-err" hidden></p>
    <button class="c-btn c-btn--primary" type="submit">Otevřít mapu</button>
  </form>
</main>

<main class="zm-main" id="app-main" hidden>
  <div class="zm-stage">
    <div class="zm-map" id="map" role="application" aria-label="Zvuková mapa okolí školy"></div>
    <div class="c-seg zm-skoly" role="group" aria-label="Škola" id="skoly">
      <button type="button" data-v="hloubetin">Hloubětín</button>
      <button type="button" data-v="dedina">Dědina</button>
    </div>
    <button class="c-btn c-btn--primary zm-add" type="button" id="btn-add" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Přidat místo
    </button>
    <div class="zm-teacher" id="teacher-bar" hidden>
      <div class="zm-teacher__in">
        <button class="c-switch" type="button" role="switch" aria-checked="false" id="btn-hidden">
          <span>Zobrazit skryté</span><span class="c-track" aria-hidden="true"></span>
        </button>
        <div class="zm-teacher__links">
          <button type="button" id="btn-export">Exportovat</button>
          <label for="import-file">Importovat</label>
        </div>
      </div>
    </div>
    <div class="zm-legend" id="legend"></div>
    <div class="zm-toast" id="toast" hidden></div>
  </div>
  <aside class="zm-panel is-hidden" id="panel" aria-label="Detail místa"></aside>
</main>

<footer class="v-footer">
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V6Q2 2 6 5Q10 0 14 5Q18 2 23 6Q27 1 32 5Q36 3 40 6Q44 0 49 5Q53 2 57 6Q61 1 66 5Q70 3 74 6Q78 0 83 5Q87 2 91 6Q95 1 100 5V10Z"/></svg>
  <div class="v-footer__bar">
    <div class="v-footer__in">
      <span>© <a href="https://skolavela.cz">Základní škola Vela s.r.o.</a></span>
      <nav class="p-flinks" aria-label="Patička">
        <a href="o-aplikaci.html">O aplikaci</a>
        <a href="otazky.html">Časté otázky</a>
        <a href="https://tally.so/r/Qo1aeY">Napsat připomínku</a>
      </nav>
    </div>
  </div>
</footer>

<input class="sr-only" type="file" id="import-file" accept="application/json,.json">

<script src="/assets/icons.js?v=202611102130"></script>
<script>document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = window.VELA_ICONS[el.dataset.icon] || ""; });</script>
<script src="/assets/vendor/leaflet/leaflet.js?v=202611102130"></script>
<script src="/assets/vendor/leaflet.markercluster/leaflet.markercluster.js?v=202611102130"></script>
<script src="app.js?v=202611102130"></script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
