<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Součtové úlohy - Velappky</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Pracovní listy se součtovými trojúhelníky a číselnými řadami k tisku.">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/velappky.css?v=202611101500">
<style>@page { size: A4 portrait; margin: 0; }</style>
<link rel="stylesheet" href="style.css?v=202611101500">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="generator.js?v=202611101500" defer></script>
<script src="app.js?v=202611101500" defer></script>
</head>
<body class="is-app print-portrait">

<header class="v-header">
  <div class="v-header__in">
    <div class="a-titlebar">
      <a class="a-back" href="/#/matematika">
        <span data-icon="ui_back"></span><span class="a-back__label">Matematika</span>
      </a>
      <div class="a-name">
        <span class="v-icon tone-blue" data-icon="souctove"></span>
        <h1>Součtové úlohy</h1>
        <span class="a-name__sub">Trojúhelníky a řady k tisku</span>
      </div>
    </div>
    <a class="v-logo v-logo--small" href="/" aria-label="Velappky - úvod">
      <img src="/assets/vela-logo.png" alt="škola Vela" width="255" height="99">
    </a>
  </div>
</header>

<main class="a-layout">
  <section class="a-panel" aria-label="Nastavení">
    <div class="c-field">
      <span class="c-label" id="lbl-typ">Typ úlohy</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-typ" id="typ">
        <button type="button" data-v="trojuhelnik">Trojúhelník</button>
        <button type="button" data-v="rada">Řada</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-vel">Velikost</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-vel" id="vel"></div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-obor">Číselný obor</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-obor" id="obor">
        <button type="button" data-v="20">do 20</button>
        <button type="button" data-v="100">do 100</button>
        <button type="button" data-v="1000">do 1000</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-obt">Obtížnost</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-obt" id="obtiznost">
        <button type="button" data-v="lehka">Lehká</button>
        <button type="button" data-v="stredni">Střední</button>
        <button type="button" data-v="narocna">Náročná</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-res">Počet řešení</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-res" id="reseni">
        <button type="button" data-v="jedno">Jedno</button>
        <button type="button" data-v="vice">Více</button>
        <button type="button" data-v="mix">Mix</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-pocet">Počet úloh</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-pocet" id="pocet">
        <button type="button" data-v="6">6</button>
        <button type="button" data-v="9">9</button>
        <button type="button" data-v="12">12</button>
      </div>
    </div>
    <button class="c-switch" type="button" role="switch" aria-checked="false" id="ukazat">
      <span>Řešení</span><span class="c-track" aria-hidden="true"></span>
    </button>
    <button class="c-btn c-btn--primary" type="button" id="novy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      Nový list
    </button>
    <hr class="c-sep">
    <div class="c-btns">
      <button class="c-btn c-btn--secondary" type="button" id="pdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 19.5h14"/></svg>
        <span>PDF</span>
      </button>
      <button class="c-btn c-btn--secondary" type="button" id="tisk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-join="round" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></svg>
        Tisk
      </button>
    </div>
    <div class="c-field">
      <label class="c-label" for="cislo">Číslo zadání</label>
      <input class="c-input" type="text" id="cislo" inputmode="numeric" autocomplete="off">
    </div>
    <p class="c-meta" id="info"></p>
  </section>

  <section class="a-stage" aria-label="Náhled listu">
    <div class="a-sheet a-sheet--portrait su-sheet" id="sheet"></div>
  </section>
</main>

<footer class="v-footer">
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V6Q2 2 6 5Q10 0 14 5Q18 2 23 6Q27 1 32 5Q36 3 40 6Q44 0 49 5Q53 2 57 6Q61 1 66 5Q70 3 74 6Q78 0 83 5Q87 2 91 6Q95 1 100 5V10Z"/></svg>
  <div class="v-footer__bar">
    <div class="v-footer__in">
      <span>© <a href="https://skolavela.cz">Základní škola Vela s.r.o.</a></span>
      <a href="https://tally.so/r/Qo1aeY">Napsat připomínku</a>
    </div>
  </div>
</footer>

<script src="/assets/icons.js?v=202611101500"></script>
<script>document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = window.VELA_ICONS[el.dataset.icon] || ""; });</script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
