<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slepá mapa - Velappky</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Slepá mapa Česka: kraje, krajská města, řeky a pohoří. Hledání na mapě, poznávání a pracovní list k tisku.">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/velappky.css?v=202611111100">
<link rel="stylesheet" href="style.css?v=202611111240">
<script src="slepa-mapa.data.js?v=202611111230" defer></script>
<script src="app.js?v=202611111240" defer></script>
</head>
<body class="is-app">

<header class="v-header">
  <div class="v-header__in">
    <div class="a-titlebar">
      <a class="a-back" href="/#/zemepis" data-back-fixed aria-label="Zpět: Zeměpis">
        <span data-icon="ui_back"></span><span class="a-back__label">Zeměpis</span>
      </a>
      <div class="a-name">
        <span class="v-icon tone-yellow" data-icon="slepamapa"></span>
        <h1>Slepá mapa</h1>
        <span class="a-name__sub">Kraje, řeky, hory a města</span>
      </div>
    </div>
    <a class="v-logo v-logo--small" href="/" aria-label="Velappky - úvod">
      <img src="/assets/vela-logo.png" alt="škola Vela" width="255" height="99">
    </a>
  </div>
</header>

<main class="sm-game" id="game">
  <div class="a-toolbar sm-w">
    <div class="c-seg sm-modes" role="group" aria-label="Režim" id="modes">
      <button type="button" data-m="najdi" aria-pressed="false">Najdi</button>
      <button type="button" data-m="coto" aria-pressed="false">Co to je</button>
      <button type="button" data-m="prohl" aria-pressed="false">Prohlížení</button>
    </div>
    <span class="sm-tright"><span class="sm-count" id="count"></span><button class="c-btn c-btn--secondary sm-quit" type="button" id="quit" hidden>Ukončit</button></span>
  </div>
  <div class="a-card sm-mapcard" id="mapcard">
    <svg class="sm-map" id="map" viewBox="0 0 1000 580" role="group" aria-label="Slepá mapa Česka"></svg>
    <p class="c-meta sm-attr" id="attr">Mapové podklady: ČÚZK, Data200, CC BY 4.0, zjednodušeno. Sousední státy: Natural Earth.</p>
  </div>
  <section class="a-card sm-w sm-task" id="task" aria-label="Zadání"></section>
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
</main>

<main class="a-layout sm-sheetview" id="sheetView" hidden>
  <section class="a-panel" aria-label="Nastavení listu">
    <a class="c-btn c-btn--secondary" href="#" id="toMap">
      <span data-icon="ui_back" style="width:17px;height:17px;display:inline-flex"></span><span>Zpět na mapu</span>
    </a>
    <div class="c-field">
      <span class="c-label" id="lbl-kind">Na listu</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-kind" id="sheetKind"></div>
    </div>
    <div class="c-field">
      <label class="c-label" for="seed">Číslo listu</label>
      <input class="c-input" type="text" id="seed" inputmode="numeric" autocomplete="off">
    </div>
    <button class="c-btn c-btn--primary" type="button" id="newSheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      Nový list
    </button>
    <hr class="c-sep">
    <button class="c-switch" type="button" role="switch" aria-checked="false" id="showSol">
      <span>Řešení</span><span class="c-track" aria-hidden="true"></span>
    </button>
    <button class="c-btn c-btn--secondary" type="button" id="print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><path d="M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></svg>
      <span>Vytisknout / uložit PDF</span>
    </button>
    <p class="c-meta" id="sheetInfo"></p>
    <p class="c-meta">Mapové podklady: ČÚZK, Data200, CC BY 4.0, zjednodušeno.</p>
  </section>
  <section class="a-stage" aria-label="Náhled listu">
    <div class="a-sheet sm-sheet" id="sheet"></div>
  </section>
</main>

<footer class="v-footer">
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V6Q2 2 6 5Q10 0 14 5Q18 2 23 6Q27 1 32 5Q36 3 40 6Q44 0 49 5Q53 2 57 6Q61 1 66 5Q70 3 74 6Q78 0 83 5Q87 2 91 6Q95 1 100 5V10Z"/></svg>
  <div class="v-footer__bar">
    <div class="v-footer__in">
      <span>© <a href="https://skolavela.cz">Základní škola Vela s.r.o.</a></span>
      <nav class="p-flinks" aria-label="Patička">
        <a href="o-aplikaci.html">O aplikaci</a>
        <a href="https://tally.so/r/Qo1aeY">Napsat připomínku</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/assets/data.js?v=202611111130"></script>
<script src="/assets/nav.js?v=202611102250"></script>
<script src="/assets/icons.js?v=202611111130"></script>
<script>document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = window.VELA_ICONS[el.dataset.icon] || ""; });</script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
