<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Sudoku – 4×4, 6×6 a 9×9 s nápovědou a tiskem</title>
<link rel="stylesheet" href="style.css?v=202611091700">
<script src="engine.js?v=202611091700" defer></script>
<script src="app.js?v=202611091700" defer></script>
</head>
<body>
<header class="bar">
  <a class="back" href="../"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>Aplikace</a>
  <h1>Sudoku</h1>
</header>
<main class="layout">
  <section class="play" aria-label="Hra">
    <div class="ptop"><span id="meta"></span><span id="status"></span></div>
    <div class="board" id="board" role="grid" aria-label="Sudoku"></div>
    <div class="hintbox" id="hintbox" hidden>
      <p id="hinttext"></p>
      <div class="actions"><button class="ghost" id="hintClose" type="button">Zavřít</button><button class="primary" id="hintFill" type="button">Doplnit číslo</button></div>
    </div>
    <div class="done" id="done" hidden>
      <h2>Vyřešeno</h2>
      <p class="mut" id="doneText"></p>
      <button class="primary" id="again" type="button">Další sudoku</button>
    </div>
    <div class="tools" id="tools">
      <button type="button" id="tUndo" data-ic="undo">Zpět</button>
      <button type="button" id="tErase" data-ic="erase">Smazat</button>
      <button type="button" id="tNotes" data-ic="pencil">Poznámky</button>
      <button type="button" id="tHint" data-ic="bulb">Nápověda</button>
    </div>
    <div class="pad" id="pad"></div>
  </section>
  <aside class="side">
    <div class="gh">Nové sudoku</div>
    <div class="list">
      <div class="li"><span>Velikost</span><div class="seg" id="segSize"><button data-v="4">4×4</button><button data-v="6">6×6</button><button data-v="9">9×9</button></div></div>
      <div class="li"><span>Obtížnost</span><div class="seg" id="segLevel"><button data-v="0">Lehká</button><button data-v="1">Střední</button><button data-v="2">Těžká</button></div></div>
      <button class="li act" id="newGame" type="button"><span>Začít nové sudoku</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <p class="note" id="levelNote"></p>

    <div class="gh">Pomocníci</div>
    <div class="list" id="helpers"></div>

    <div class="gh">Tisk</div>
    <div class="list">
      <div class="li"><span>Sudoku na stránku</span><div class="seg" id="segPer"><button data-v="1">1</button><button data-v="2">2</button><button data-v="4">4</button><button data-v="6">6</button></div></div>
      <label class="li sw"><span>Řešení na 2. stránce</span><input type="checkbox" id="printSol"><i></i></label>
      <button class="li act" id="printBtn" type="button"><span>Tisk nebo PDF</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H4v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6h-3M7 14h10v7H7z"/></svg></button>
    </div>
    <p class="note">Vytiskne nová zadání ve zvolené velikosti a obtížnosti. PDF uložíte volbou „Uložit jako PDF“ v okně tisku.</p>
  </aside>
</main>
<div id="printout" aria-hidden="true"></div>
<script src="../shared/footer.js?v=202611091700" data-note="Rozehrané sudoku a nastavení se ukládají jen v tomto zařízení." defer></script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
