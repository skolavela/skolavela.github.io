<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velappky</title>
<meta name="description" content="Nástroje k objevování světa ze školy Vela.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="Velappky">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/velappky.css?v=202611101500">
</head>
<body>

<header class="v-header">
  <div class="v-header__in">
    <a class="v-logo" href="#/" aria-label="Velappky - úvod">
      <img src="/assets/vela-logo.png" alt="škola Vela" width="255" height="99">
    </a>
    <form class="v-search" role="search" onsubmit="return false">
      <label class="sr-only" for="hledat">Hledat aplikaci</label>
      <span data-icon="ui_search"></span>
      <input id="hledat" type="search" placeholder="Hledat aplikaci" autocomplete="off" enterkeyhint="search">
    </form>
  </div>
</header>

<section class="v-hero" id="hero">
  <svg class="v-doodle v-doodle--l" viewBox="0 0 240 220" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M40 30l22 36H18z"/><path d="M30 130c8-11 16-11 24 0s16 11 24 0 16-11 24 0"/><path d="M140 60l14 14M154 60l-14 14"/><circle cx="110" cy="190" r="4"/><circle cx="130" cy="176" r="3"/></svg>
  <svg class="v-doodle v-doodle--r" viewBox="0 0 240 220" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="190" cy="40" r="15"/><path d="M60 90l28-7 6 28-28 7z"/><path d="M150 150c8-11 16-11 24 0s16 11 24 0"/><path d="M200 190v20M190 200h20"/><circle cx="40" cy="170" r="4"/></svg>
  <div class="v-hero__in">
    <nav aria-label="Umístění" id="crumbs-nav" hidden><ol class="v-crumbs" id="crumbs"></ol></nav>
    <h1 id="title">Velappky</h1>
    <div class="v-wave" data-icon="ui_wave"></div>
    <p id="subtitle">Nástroje k objevování světa</p>
  </div>
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V7Q3 2 7 6Q10 1 15 5Q19 2 22 6Q26 0 31 5Q35 3 38 6Q42 1 47 5Q51 2 54 6Q58 0 63 5Q67 3 70 6Q74 1 79 5Q83 2 86 6Q90 0 95 5Q98 3 100 6V10Z"/></svg>
</section>

<main class="v-main">
  <ul class="v-grid" id="grid"></ul>
  <div class="v-empty" id="empty" hidden>
    <div class="v-wave" data-icon="ui_wave" style="color:var(--doodle)"></div>
    <h2 id="empty-title"></h2>
    <p id="empty-text"></p>
  </div>
</main>

<footer class="v-footer">
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V6Q2 2 6 5Q10 0 14 5Q18 2 23 6Q27 1 32 5Q36 3 40 6Q44 0 49 5Q53 2 57 6Q61 1 66 5Q70 3 74 6Q78 0 83 5Q87 2 91 6Q95 1 100 5V10Z"/></svg>
  <div class="v-footer__bar">
    <div class="v-footer__in">
      <span>© <a href="https://skolavela.cz">Základní škola Vela s.r.o.</a></span>
      <a href="https://tally.so/r/Qo1aeY">Napsat připomínku</a>
    </div>
  </div>
</footer>

<script src="/assets/icons.js?v=202611101500"></script>
<script src="/assets/data.js?v=202611101500"></script>
<script>
(function () {
  "use strict";
  var ICONS = window.VELA_ICONS, DATA = window.VELAPPKY;
  var FEEDBACK = "https://tally.so/r/Qo1aeY";
  var $ = function (id) { return document.getElementById(id); };
  var hero = $("hero"), grid = $("grid"), input = $("hledat");

  // statické ikony (lupa, vlnky)
  document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = ICONS[el.dataset.icon]; });

  // ---------- pomocné ----------
  var norm = function (s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };
  var appWord = function (n) {
    if (n === 1) return "1 aplikace";
    return n + (n >= 2 && n <= 4 ? " aplikace" : " aplikací");
  };
  var countApps = function (node) {
    if (node.type === "app") return 1;
    return (node.items || []).reduce(function (s, c) { return s + countApps(c); }, 0);
  };
  // najde cestu složek podle id z adresy (#/cestina/cteni)
  var resolve = function (ids) {
    var level = DATA, trail = [];
    for (var i = 0; i < ids.length; i++) {
      var f = level.filter(function (n) { return n.type === "folder" && n.id === ids[i]; })[0];
      if (!f) break;
      trail.push(f); level = f.items || [];
    }
    return trail;
  };
  var hrefFor = function (trail) { return "#/" + trail.map(function (f) { return f.id; }).join("/"); };

  // ---------- dlaždice ----------
  var tile = function (node, trail, caption) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    var isFolder = node.type === "folder";
    a.className = "v-tile" + (isFolder ? " v-tile--folder" : "");
    a.href = isFolder ? hrefFor(trail.concat(node)) : node.url;

    var art = document.createElement("span");
    art.className = "v-tile__art";
    var icon = document.createElement("span");
    icon.className = "v-icon tone-" + (node.tone || "blue");
    icon.innerHTML = ICONS[node.icon] || ICONS[isFolder ? "slozka" : "appka"];
    art.appendChild(icon);

    var name = document.createElement("span");
    name.className = "v-tile__name";
    name.textContent = node.name;
    var sub = document.createElement("span");
    sub.className = "v-tile__sub";
    if (caption) sub.textContent = caption;
    else if (isFolder) { var n = countApps(node); sub.textContent = n ? appWord(n) : "Zatím prázdné"; }
    else sub.textContent = node.short || "";

    var text = document.createElement("span");
    text.className = "v-tile__text";
    text.appendChild(name); text.appendChild(sub);
    a.appendChild(art); a.appendChild(text);
    if (isFolder) a.setAttribute("aria-label", "Složka " + node.name + ", " + sub.textContent);
    li.appendChild(a);
    return li;
  };

  // ---------- hledání ----------
  var search = function (q) {
    var nq = norm(q), out = [];
    var walk = function (items, trail) {
      items.forEach(function (n) {
        if (n.type === "folder") { walk(n.items || [], trail.concat(n)); return; }
        var grades = (n.grades || []).map(function (g) { return g + ". stupen"; }).join(" ");
        var hay = norm([n.name, n.short, n.keywords, grades, trail.map(function (f) { return f.name; }).join(" ")].join(" "));
        if (nq.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; })) out.push({ node: n, trail: trail });
      });
    };
    walk(DATA, []);
    return out;
  };

  // ---------- vykreslení ----------
  var render = function () {
    var q = input.value.trim();
    var ids = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    var trail = resolve(ids);
    var folder = trail[trail.length - 1];
    var compact = !!(q || folder);

    hero.classList.toggle("v-hero--compact", compact);
    grid.innerHTML = "";
    $("empty").hidden = true;

    // drobečky
    var crumbs = $("crumbs");
    crumbs.innerHTML = "";
    $("crumbs-nav").hidden = !(folder && !q);
    if (folder && !q) {
      var mk = function (label, href, current) {
        var li = document.createElement("li");
        var el = document.createElement(current ? "span" : "a");
        el.textContent = label;
        if (current) el.setAttribute("aria-current", "page"); else el.href = href;
        li.appendChild(el); crumbs.appendChild(li);
      };
      mk("Všechny", "#/", false);
      trail.forEach(function (f, i) { mk(f.name, hrefFor(trail.slice(0, i + 1)), i === trail.length - 1); });
    }

    if (q) {
      var hits = search(q);
      $("title").textContent = "Výsledky hledání";
      $("subtitle").textContent = hits.length ? appWord(hits.length) : "";
      hits.forEach(function (h) {
        grid.appendChild(tile(h.node, h.trail, h.trail.map(function (f) { return f.name; }).join(" › ")));
      });
      if (!hits.length) showEmpty("Nic jsme nenašli", "Zkuste jiné slovo, nebo nám ", "napište, co vám chybí");
      document.title = "Hledání - Velappky";
    } else if (folder) {
      var n = countApps(folder);
      $("title").textContent = folder.name;
      $("subtitle").textContent = n ? appWord(n) : "";
      (folder.items || []).forEach(function (c) { grid.appendChild(tile(c, trail)); });
      if (!(folder.items || []).length) showEmpty("Tady zatím nic není", "Máte nápad na aplikaci? ", "Napište nám");
      document.title = folder.name + " - Velappky";
    } else {
      $("title").textContent = "Velappky";
      $("subtitle").textContent = "Nástroje k objevování světa";
      DATA.forEach(function (c) { grid.appendChild(tile(c, [])); });
      document.title = "Velappky";
    }
  };

  var showEmpty = function (title, text, linkText) {
    $("empty").hidden = false;
    $("empty-title").textContent = title;
    var p = $("empty-text");
    p.textContent = text;
    var a = document.createElement("a");
    a.href = FEEDBACK; a.textContent = linkText;
    p.appendChild(a); p.appendChild(document.createTextNode("."));
  };

  // ---------- události ----------
  window.addEventListener("hashchange", function () {
    input.value = "";
    render();
    window.scrollTo(0, 0);
  });
  input.addEventListener("input", render);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { input.value = ""; render(); input.blur(); }
  });
  // klávesová zkratka "/" skočí do hledání (desktop)
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); input.focus(); }
  });

  render();
})();
</script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
