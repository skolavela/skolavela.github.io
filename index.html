<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Školní aplikace</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--mut:#6e6e73;--card:rgba(255,255,255,.72);--bd:rgba(0,0,0,.08);--sh:0 10px 40px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mut:#a1a1a6;--card:rgba(44,44,46,.6);--bd:rgba(255,255,255,.1);--sh:0 10px 40px rgba(0,0,0,.5)}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;background-image:radial-gradient(1200px 600px at 10% -10%,rgba(0,113,227,.10),transparent),radial-gradient(900px 500px at 110% 10%,rgba(175,82,222,.08),transparent)}
header{text-align:center;padding:72px 20px 32px}h1{font-size:clamp(40px,6vw,64px);letter-spacing:-.03em;margin:0}
.sub{color:var(--mut);font-size:19px;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;max-width:1100px;margin:0 auto;padding:24px}
.card{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:22px;background:var(--card);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--bd);box-shadow:var(--sh);color:inherit;text-decoration:none;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 50px rgba(0,0,0,.14)}
.ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff}
.card h2{margin:4px 0 0;font-size:21px}.card p{margin:0;color:var(--mut);font-size:15px;line-height:1.45}
.go{margin-top:auto;font-size:15px;font-weight:600;color:#0071e3}
.soon{opacity:.55;border-style:dashed;box-shadow:none;justify-content:center;align-items:center;text-align:center}
.filters{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:10px;align-items:center}
.frow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.flbl{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.fc{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:980px;padding:7px 14px;cursor:pointer;background:rgba(118,118,128,.12);color:var(--fg);transition:all .2s}
.fc.on{background:var(--fg);color:var(--bg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tg{font-size:12px;font-weight:600;padding:3px 9px;border-radius:980px;background:rgba(118,118,128,.12);color:var(--mut)}
.tg.g{background:rgba(0,113,227,.1);color:#0071e3}
.empty{grid-column:1/-1;text-align:center;color:var(--mut)}
@media (max-width:520px){header{padding:48px 16px 20px}.grid{padding:16px;gap:16px}}
</style></head><body>
<header><h1>Školní aplikace</h1><p class="sub">Užitečné nástroje do výuky. Jednoduše, hezky, zdarma.</p></header>
<nav class="filters" id="filters" aria-label="Filtry"></nav>
<main class="grid" id="grid"></main>
<script src="apps.js?v=202611091700"></script>
<script>
const ICONS={maze:'<path d="M4 4h16v16H4zM8 4v8h4M16 8v8h-8M12 16v4"/>',text:'<path d="M5 7V5h14v2M12 5v14M9 19h6"/>',grid:'<path d="M4 4h16v16H4zM4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"/>',leaf:'<path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14zM5 19l8-8"/>',sudoku:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18"/><path d="M7 6.5v4M15.5 7.2q1-.9 2-.2.8.7-.1 1.6L15.5 10.5h2.6M6.2 14.2q1.2-.8 2 0 .6.8-.6 1.4 1.4.4.8 1.6-.9.9-2.2 0"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5M22 9v6"/>',default:'<circle cx="12" cy="12" r="8"/>'};
const g=document.getElementById('grid'),fl=document.getElementById('filters');
const F={grade:new Set(),subj:new Set()};
const SUBJ=[...new Set(APPS.flatMap(a=>a.subj||[]))];
function chips(){fl.innerHTML=`<div class="frow"><span class="flbl">Stupeň</span>${[1,2].map(v=>`<button class="fc ${F.grade.has(v)?'on':''}" data-k="grade" data-v="${v}">${v}. stupeň</button>`).join('')}</div>
<div class="frow"><span class="flbl">Předmět</span>${SUBJ.map(v=>`<button class="fc ${F.subj.has(v)?'on':''}" data-k="subj" data-v="${v}">${v}</button>`).join('')}</div>`;
fl.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=k==='grade'?+b.dataset.v:b.dataset.v;F[k].has(v)?F[k].delete(v):F[k].add(v);chips();draw();});}
function draw(){const list=APPS.filter(a=>(!F.grade.size||(a.grade||[]).some(x=>F.grade.has(x)))&&(!F.subj.size||(a.subj||[]).some(x=>F.subj.has(x))));
g.innerHTML=list.map(a=>`<a class="card" href="${a.url}"><div class="ic" style="background:${a.color||'#0071e3'}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[a.icon]||ICONS.default}</svg></div><h2>${a.name}</h2><div class="tags">${(a.grade||[]).map(x=>`<span class="tg g">${x}. stupeň</span>`).join('')}${(a.subj||[]).map(x=>`<span class="tg">${x}</span>`).join('')}</div><p>${a.desc}</p><span class="go">Otevřít ›</span></a>`).join('')+(list.length?'<div class="card soon"><p>Další aplikace brzy…</p></div>':'<p class="empty">Pro tuto kombinaci filtrů zatím nic nemáme.</p>');}
chips();draw();
</script>
<script src="shared/footer.js?v=202611032310" data-auto-dark defer></script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body></html>
