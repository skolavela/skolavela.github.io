<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bludiště – generátor bludišť k tisku</title>
<link rel="stylesheet" href="style.css?v=202611031600">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="app.js?v=202611031500" defer></script>
</head>
<body>
<header class="bar">
  <a class="back" href="../">‹ Rozcestník</a>
  <h1><span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM8 4v8h4M16 8v8h-8M12 16v4"/></svg></span>Bludiště</h1>
  <span class="sub">Bludiště k tisku na A4</span>
</header>
<main class="layout">
  <section class="card controls" aria-label="Nastavení">
    <div class="group">
      <label class="lbl">Obtížnost</label>
      <div class="seg" id="presets">
        <button data-p="easy">Lehké</button><button data-p="medium">Střední</button><button data-p="hard">Těžké</button><button data-p="expert">Expert</button>
      </div>
    </div>
    <div class="group">
      <label class="lbl" for="size">Velikost <span class="val" id="sizeVal"></span></label>
      <input type="range" id="size" min="6" max="70" step="1">
    </div>
    <div class="group">
      <label class="lbl" for="seed">Seed</label>
      <input type="text" id="seed" inputmode="numeric" autocomplete="off">
    </div>
    <button class="primary" id="newMaze">Nové bludiště</button>
    <label class="tg"><span>Zobrazit řešení</span><input type="checkbox" id="showSol"><i></i></label>
    <div class="actions">
      <button class="primary" id="pdf">Uložit PDF</button>
      <button class="ghost" id="print">Tisk</button>
    </div>
    <p class="hint" id="info"></p>
  </section>
  <section class="stage" aria-label="Náhled">
    <div class="sheet" id="sheet"><div id="svgWrap"></div><p class="mfoot" id="mfoot"></p></div>
  </section>
</main>
<script src="../shared/footer.js?v=202611032310" defer></script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
