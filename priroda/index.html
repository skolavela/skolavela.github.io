<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poznáváme přírodu - Velappky</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/velappky.css?v=202611101155">
<link rel="stylesheet" href="style.css?v=202611102200">
<script src="data.js?v=202611102200" defer></script>
<script src="app.js?v=202611102200" defer></script>
</head>
<body class="is-app">

<header class="v-header">
  <div class="v-header__in">
    <div class="a-titlebar">
      <a class="a-back" href="/">
        <span data-icon="ui_back"></span><span class="a-back__label">Velappky</span>
      </a>
      <div class="a-name">
        <span class="v-icon tone-green" data-icon="priroda"></span>
        <h1>Poznáváme přírodu</h1>
        <span class="a-name__sub">Kvíz podle fotek</span>
      </div>
    </div>
    <a class="v-logo v-logo--small" href="/" aria-label="Velappky - úvod">
      <img src="/assets/vela-logo.png" alt="škola Vela" width="255" height="99">
    </a>
  </div>
</header>

<main class="a-single tone-green">
  <section class="p-setup" id="setup">
    <h2 class="p-title">Co budeme poznávat?</h2>
    <div class="a-card p-opts">
      <div class="c-field"><span class="c-label" id="lbl-lvl">Úroveň</span><div class="c-seg" role="group" aria-labelledby="lbl-lvl" id="lvl"><button type="button" data-v="1">1. stupeň</button><button type="button" data-v="2">2. stupeň</button></div></div>
      <div class="c-field"><span class="c-label" id="lbl-mode">Režim</span><div class="c-seg" role="group" aria-labelledby="lbl-mode" id="mode"><button type="button" data-v="quiz">Kvíz</button><button type="button" data-v="cards">Kartičky</button></div></div>
    </div>
    <div class="p-sumrow">
      <p class="p-count" id="avail"></p>
      <button class="p-link p-more" type="button" id="more" aria-expanded="false" aria-controls="choices">Upravit výběr <span class="chev" aria-hidden="true">›</span></button>
    </div>
    <button class="c-btn c-btn--primary p-start" type="button" id="start">Začít</button>
    <div class="p-choices" id="choices" hidden>
      <div class="p-sec">
        <div class="c-row"><span class="c-label">Skupiny</span><button class="p-link" type="button" data-all="cats" id="allCats"></button></div>
        <div class="p-tiles" id="cats"></div>
      </div>
      <div class="p-sec" id="subsWrap">
        <div class="c-row"><span class="c-label">Upřesnit podskupiny</span></div>
        <div class="a-card p-list" id="subs"></div>
      </div>
      <div class="p-sec">
        <div class="c-row"><span class="c-label">Světadíly</span><button class="p-link" type="button" data-all="conts" id="allConts"></button></div>
        <div class="p-tiles p-tiles--cont" id="conts"></div>
      </div>
      <div class="a-card">
        <div class="c-field"><span class="c-label" id="lbl-len">Počet otázek</span><div class="c-seg" role="group" aria-labelledby="lbl-len" id="len"><button type="button" data-v="10">10</button><button type="button" data-v="20">20</button><button type="button" data-v="0">Vše</button></div></div>
      </div>
    </div>
    <p class="c-meta p-note">Fotografie: Wikimedia Commons (autor a licence u každé fotky), uložené na velappky.cz.</p>
  </section>

  <section class="p-play" id="play" hidden>
    <div class="a-toolbar">
      <span class="c-meta p-qnum" id="qnum"></span>
      <span class="p-tright"><span class="c-meta p-score" id="score" hidden></span><button class="c-btn c-btn--secondary p-quit" type="button" id="quit">Ukončit</button></span>
    </div>
    <div class="a-progress"><span id="bar"></span></div>
    <div class="a-card p-card">
      <figure class="photo" id="photoWrap"><img class="bg" id="photoBg" alt="" aria-hidden="true"><img class="main" id="photo" alt="Fotografie – poznáš, co to je?"><div class="ph" id="ph">Načítám fotku…</div></figure>
      <p class="credit" id="credit"></p>
      <div class="a-choices" id="opts"></div>
      <div class="fb"><div class="reveal" id="reveal"></div>
      <button class="c-btn c-btn--primary" type="button" id="next">Další</button></div>
    </div>
  </section>

  <section class="a-card p-done" id="done" hidden>
    <h2 id="doneTitle"></h2>
    <p class="doneText" id="doneText"></p>
    <div class="missed" id="missed"></div>
    <button class="c-btn c-btn--primary" type="button" id="again">Hrát znovu</button>
    <button class="c-btn c-btn--secondary" type="button" id="home">Změnit nastavení</button>
  </section>
</main>

<footer class="v-footer">
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V6Q2 2 6 5Q10 0 14 5Q18 2 23 6Q27 1 32 5Q36 3 40 6Q44 0 49 5Q53 2 57 6Q61 1 66 5Q70 3 74 6Q78 0 83 5Q87 2 91 6Q95 1 100 5V10Z"/></svg>
  <div class="v-footer__bar">
    <div class="v-footer__in">
      <span>© <a href="https://skolavela.cz">Základní škola Vela s.r.o.</a></span>
      <a href="https://tally.so/r/Qo1aeY">Napsat připomínku</a>
    </div>
  </div>
</footer>

<script src="/assets/data.js?v=202611111130"></script>
<script src="/assets/nav.js?v=202611102250"></script>
<script src="/assets/icons.js?v=202611111130"></script>
<script>document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = window.VELA_ICONS[el.dataset.icon] || ""; });</script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
