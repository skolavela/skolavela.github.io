<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poznáváme přírodu – kvíz pro děti</title>
<link rel="stylesheet" href="style.css?v=202611032310">
<script src="data.js?v=202611031600" defer></script>
<script src="app.js?v=202611031600" defer></script>
</head>
<body>
<header class="bar">
  <a class="back" href="../">‹ Rozcestník</a>
  <h1><span class="logo">🌿</span>Poznáváme přírodu</h1>
  <span class="score" id="score" hidden></span>
</header>
<main class="wrap">
  <section class="setup" id="setup">
    <div class="intro"><h2>Co budeme poznávat?</h2><p>Vyberte skupiny a světadíly. Fotky jsou z Wikimedia Commons.</p></div>
    <div class="sec">
      <div class="sh"><span>Skupiny</span><button class="tb" data-all="cats" id="allCats"></button></div>
      <div class="tiles" id="cats"></div>
    </div>
    <div class="sec" id="subsWrap">
      <div class="sh"><span>Upřesnit podskupiny</span></div>
      <div class="list" id="subs"></div>
    </div>
    <div class="sec">
      <div class="sh"><span>Světadíly</span><button class="tb" data-all="conts" id="allConts"></button></div>
      <div class="tiles cont" id="conts"></div>
    </div>
    <div class="sec">
      <div class="sh"><span>Nastavení</span></div>
      <div class="opts3">
        <div class="og"><label>Úroveň</label><div class="seg" id="lvl"><button data-v="1">1. stupeň</button><button data-v="2">2. stupeň</button></div></div>
        <div class="og"><label>Režim</label><div class="seg" id="mode"><button data-v="quiz">Kvíz</button><button data-v="cards">Kartičky</button></div></div>
        <div class="og"><label>Počet otázek</label><div class="seg" id="len"><button data-v="10">10</button><button data-v="20">20</button><button data-v="0">Vše</button></div></div>
      </div>
    </div>
    <div class="startbar"><p class="count" id="avail"></p><button class="primary big" id="start">Začít</button></div>
  </section>
  <section class="card play" id="play" hidden>
    <div class="prog"><div id="bar"></div></div>
    <div class="ptop"><span id="qnum"></span><button class="link" id="quit">Ukončit</button></div>
    <figure class="photo" id="photoWrap"><img class="bg" id="photoBg" alt="" aria-hidden="true"><img class="main" id="photo" alt="Fotografie – poznáš, co to je?"><div class="ph" id="ph">Načítám fotku…</div></figure>
    <p class="credit" id="credit"></p>
    <div class="opts" id="opts"></div>
    <div class="fb"><div class="reveal" id="reveal"></div>
    <button class="primary big" id="next">Další →</button></div>
  </section>
  <section class="card" id="done" hidden>
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="doneTitle"></h2>
    <p class="doneText" id="doneText"></p>
    <div class="missed" id="missed"></div>
    <button class="primary big" id="again">Hrát znovu</button>
    <button class="ghost" id="home">Změnit nastavení</button>
  </section>
</main>
<script src="../shared/footer.js?v=202611032310" data-note="Fotografie: Wikimedia Commons (autor a licence u každé fotky), uložené na skolavela.app." defer></script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
