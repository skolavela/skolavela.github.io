<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abaku - Velappky</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Pracovní listy Abaku k tisku: rozhodni, jestli je řetězec abaku, a doplň znaménka. S řešením.">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/velappky.css?v=202611231100">
<link rel="stylesheet" href="style.css?v=202611231100">
<script src="abaku.js?v=202611231100" defer></script>
<script src="app.js?v=202611231100" defer></script>
</head>
<body class="is-app print-portrait">

<header class="v-header">
  <div class="v-header__in">
    <div class="a-titlebar">
      <a class="a-back" href="/" aria-label="Zpět: Velappky">
        <span data-icon="ui_back"></span><span class="a-back__label">Velappky</span>
      </a>
      <div class="a-name">
        <span class="v-icon tone-blue" data-icon="abaku"></span>
        <h1>Abaku</h1>
        <span class="a-name__sub">Pracovní listy k tisku</span>
      </div>
    </div>
    <a class="v-logo v-logo--small" href="/" aria-label="Velappky - úvod">
      <img src="/assets/vela-logo.png" alt="škola Vela" width="255" height="99">
    </a>
  </div>
</header>

<main class="a-layout">
  <section class="a-panel ab-panel" aria-label="Nastavení">
    <div class="c-field">
      <span class="c-label" id="lbl-ops">Operace</span>
      <div class="ab-toggles" role="group" aria-labelledby="lbl-ops" id="ops">
        <button type="button" data-v="plus" aria-pressed="false" aria-label="Sčítání" title="Sčítání">+</button>
        <button type="button" data-v="minus" aria-pressed="false" aria-label="Odčítání" title="Odčítání">&minus;</button>
        <button type="button" data-v="krat" aria-pressed="false" aria-label="Násobení" title="Násobení">&middot;</button>
        <button type="button" data-v="deleno" aria-pressed="false" aria-label="Dělení" title="Dělení">:</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-max">Čísla</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-max" id="max">
        <button type="button" data-v="9">Jednociferná</button>
        <button type="button" data-v="20">do 20</button>
        <button type="button" data-v="100">do 100</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-len">Počet číslic v řetězci</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-len" id="len">
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4</button>
        <button type="button" data-v="5">5</button>
        <button type="button" data-v="6">6</button>
      </div>
      <p class="c-meta" id="lenNote" hidden></p>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-dir">Čtení</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-dir" id="dir">
        <button type="button" data-v="ltr">Zleva doprava</button>
        <button type="button" data-v="both">Oběma směry</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-types">Úlohy</span>
      <div class="ab-toggles ab-toggles--text" role="group" aria-labelledby="lbl-types" id="types">
        <button type="button" data-v="ano" aria-pressed="false">Je to abaku?</button>
        <button type="button" data-v="dopln" aria-pressed="false">Doplň znaménka</button>
      </div>
    </div>
    <div class="c-field">
      <span class="c-label" id="lbl-count">Počet úloh</span>
      <div class="c-seg" role="group" aria-labelledby="lbl-count" id="count">
        <button type="button" data-v="8">8</button>
        <button type="button" data-v="12">12</button>
        <button type="button" data-v="16">16</button>
        <button type="button" data-v="20">20</button>
      </div>
    </div>
    <div class="c-field">
      <label class="c-label" for="seed">Číslo listu</label>
      <input class="c-input" type="text" id="seed" inputmode="numeric" autocomplete="off" maxlength="9">
    </div>
    <button class="c-btn c-btn--primary" type="button" id="newSheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      Nový list
    </button>
    <hr class="c-sep">
    <button class="c-switch" type="button" role="switch" aria-checked="true" id="showSol">
      <span>Řešení na 2. straně</span><span class="c-track" aria-hidden="true"></span>
    </button>
    <button class="c-btn c-btn--secondary" type="button" id="print">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><path d="M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v6H7z"/></svg>
      <span>Vytisknout / uložit PDF</span>
    </button>
    <p class="c-meta" id="info"></p>
  </section>

  <section class="a-stage ab-stage" aria-label="Náhled listu">
    <div class="ab-pages" id="pages"></div>
  </section>
</main>

<footer class="v-footer">
  <svg class="v-clouds" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 10V6Q2 2 6 5Q10 0 14 5Q18 2 23 6Q27 1 32 5Q36 3 40 6Q44 0 49 5Q53 2 57 6Q61 1 66 5Q70 3 74 6Q78 0 83 5Q87 2 91 6Q95 1 100 5V10Z"/></svg>
  <div class="v-footer__bar">
    <div class="v-footer__in">
      <span>© <a href="https://skolavela.cz">Základní škola Vela s.r.o.</a></span>
      <nav class="p-flinks" aria-label="Patička">
        <a href="o-aplikaci.html">O aplikaci</a>
        <a href="https://tally.so/r/Qo1aeY">Napsat připomínku</a>
      </nav>
    </div>
  </div>
</footer>

<script src="/assets/data.js?v=202611231100"></script>
<script src="/assets/nav.js?v=202611102250"></script>
<script src="/assets/icons.js?v=202611231100"></script>
<script>document.querySelectorAll("[data-icon]").forEach(function (el) { el.innerHTML = window.VELA_ICONS[el.dataset.icon] || ""; });</script>
<script data-goatcounter="https://skolavela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
